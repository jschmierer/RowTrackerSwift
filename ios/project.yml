name: RowTracker
options:
  bundleIdPrefix: com.jschmierer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: RJUDH49PD3
    CODE_SIGN_STYLE: Automatic

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  RowTracker:
    type: application
    platform: iOS
    sources:
      - path: RowTracker
    resources:
      - path: RowTracker/Resources
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: RowTracker/Info.plist
      properties:
        CFBundleDisplayName: RowTracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: systemBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jschmierer.rowtracker
        DEVELOPMENT_TEAM: RJUDH49PD3
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  RowTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RowTrackerTests
      - path: ../tests/vectors
        type: folder
        buildPhase: resources
    dependencies:
      - target: RowTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jschmierer.rowtrackerTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RowTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RowTracker

schemes:
  RowTracker:
    build:
      targets:
        RowTracker: all
        RowTrackerTests: [test]
    test:
      targets:
        - RowTrackerTests
      gatherCoverageData: true
    run:
      config: Debug
